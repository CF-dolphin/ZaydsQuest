<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sriracha Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffe9c7; --fg:#2a1a10; --muted:#7a5a40; --edge:#2a1a10;
  --pad-bg:#2a1a10; --pad-fg:#ffe9c7; --pad-hot:#e8453c;
  --card-bg:#1d1633; --card-fg:#fff6e6; --card-accent:#ffcf4a; --card-line:#5a4c8c;
  --opt-bg:#2c2450; --opt-line:#5a4c8c; --good:#7cf09a; --good-bg:#1d4d31; --bad:#ff9a8a;
  --btn:#e8453c; --btn-fg:#ffffff; --btn-alt:#3b6fd9;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#170f24; --fg:#ffe9c7; --muted:#b49a7c; --edge:#000000;
    --pad-bg:#2c2450; --pad-fg:#ffe9c7; --pad-hot:#e8453c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#170f24; --fg:#ffe9c7; --muted:#b49a7c; --edge:#000000;
  --pad-bg:#2c2450; --pad-fg:#ffe9c7; --pad-hot:#e8453c;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
[hidden]{display:none !important;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:'VT323','Courier New',Courier,monospace; font-size:22px; line-height:1.2;
}
.wrap{max-width:980px; margin:0 auto; padding:10px 12px 16px;}
.bar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;}
.logo{margin:0; font-family:'Press Start 2P','Courier New',monospace; font-size:clamp(11px,2.2vw,16px); line-height:1.4; color:var(--fg);}
.logo span{display:block; font-family:'VT323','Courier New',monospace; font-size:clamp(18px,3vw,22px); color:var(--muted); letter-spacing:.02em;}
.icon-btn{font:inherit; font-size:22px; background:var(--pad-bg); color:var(--pad-fg); border:3px solid var(--edge); width:48px; height:44px; cursor:pointer; box-shadow:3px 3px 0 var(--edge);}
.icon-btn:focus-visible, button:focus-visible{outline:3px solid var(--card-accent); outline-offset:2px;}
.stage{
  position:relative; margin:0 auto;
  width:min(100%, max(300px, calc((100vh - 190px) * 5 / 3)));
  width:min(100%, max(300px, calc((100dvh - 190px) * 5 / 3)));
  aspect-ratio:5/3; border:4px solid var(--edge); background:#000;
  box-shadow:6px 6px 0 var(--edge);
}
canvas#game{display:block; width:100%; height:100%; image-rendering:crisp-edges; image-rendering:pixelated;}
.overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:12px; background:rgba(10,6,20,.45); overflow:auto; z-index:5;}
.overlay.bottom{align-items:flex-end; background:transparent;}
.overlay.dlg{align-items:flex-end; background:rgba(10,6,20,.3);}
.panel{
  background:var(--card-bg); color:var(--card-fg); border:3px solid var(--card-accent);
  box-shadow:0 0 0 3px #000, 6px 6px 0 3px rgba(0,0,0,.45);
  padding:14px 18px 16px; width:100%; max-width:640px; max-height:100%; overflow:auto;
}
.panel h2{font-family:'Press Start 2P','Courier New',monospace; font-size:clamp(14px,2.6vw,20px); line-height:1.4; color:var(--card-accent); margin:2px 0 10px;}
.panel p{margin:0 0 10px;}
.panel b{color:var(--card-accent); font-weight:normal;}
.sub{font-family:'Press Start 2P','Courier New',monospace; font-size:12px; color:#ff8a5c; margin-top:-4px !important;}
.stats{background:var(--opt-bg); border:2px solid var(--opt-line); padding:8px 12px; margin:0 0 12px; line-height:1.35;}
.controls{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; background:var(--opt-bg); border:2px solid var(--opt-line); padding:8px 12px; margin:0 0 12px; font-size:20px;}
.controls dt{color:var(--card-accent);}
.controls dd{margin:0;}
.btns{display:flex; flex-wrap:wrap; gap:10px;}
.btns button, #dlgCont{
  font-family:'Press Start 2P','Courier New',monospace; font-size:12px; line-height:1.3;
  background:var(--btn); color:var(--btn-fg); border:3px solid #000; box-shadow:3px 3px 0 #000;
  padding:11px 16px; cursor:pointer;
}
.btns button.alt{background:var(--btn-alt);}
.btns button:active, #dlgCont:active{transform:translate(2px,2px); box-shadow:1px 1px 0 #000;}
.who{display:flex; align-items:center; gap:10px; margin-bottom:6px; font-family:'Press Start 2P','Courier New',monospace; font-size:12px; color:var(--card-accent);}
#portrait{width:36px; height:54px; image-rendering:pixelated; background:var(--opt-bg); border:2px solid var(--opt-line);}
#dlgLine{font-size:24px;}
.opts button{
  display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; margin:6px 0;
  font-family:'VT323','Courier New',monospace; font-size:22px; line-height:1.15;
  background:var(--opt-bg); color:var(--card-fg); border:2px solid var(--opt-line); padding:8px 10px; cursor:pointer;
}
.opts button:hover:not(:disabled){border-color:var(--card-accent);}
.opts .num{font-family:'Press Start 2P','Courier New',monospace; font-size:10px; background:var(--card-accent); color:#000; padding:4px 6px; margin-top:2px; flex:none;}
.opts button.right{background:var(--good-bg); border-color:var(--good);}
.opts button.wrong{opacity:.55; border-color:var(--bad); text-decoration:line-through;}
.result{min-height:0; margin:8px 0 6px !important; font-size:22px;}
.result.good{color:var(--good);}
.result.bad{color:var(--bad);}
.touch{display:none; justify-content:space-between; align-items:center; gap:10px; padding:14px 2px 4px; user-select:none; -webkit-user-select:none; touch-action:none;}
.touch .pad{display:flex; gap:10px; align-items:center;}
.touch button{
  width:62px; height:62px; border-radius:50%; border:3px solid var(--edge); box-shadow:3px 3px 0 var(--edge);
  background:var(--pad-bg); color:var(--pad-fg); font-family:'Press Start 2P','Courier New',monospace; font-size:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; touch-action:none; -webkit-tap-highlight-color:transparent;
}
.touch button small{font-size:7px;}
.touch button.big{width:78px; height:78px; background:var(--pad-hot); color:#fff; font-size:10px;}
.touch button.on{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--edge);}
.keys-hint{margin:12px 0 0; text-align:center; color:var(--muted); font-size:20px;}
.keys-hint kbd{font-family:'Press Start 2P','Courier New',monospace; font-size:10px; border:2px solid var(--muted); padding:2px 5px; margin:0 2px;}
@media (hover:none) and (pointer:coarse){ .touch{display:flex;} .keys-hint{display:none;} }
@media (max-width:720px), (max-height:520px){
  .overlay, .overlay.dlg, .overlay.bottom{
    position:fixed; inset:0; background:rgba(10,6,20,.6);
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  }
  .overlay.bottom{align-items:flex-end; background:rgba(10,6,20,.25);}
}
@media (prefers-reduced-motion:reduce){ .btns button:active{transform:none;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <h1 class="logo">Sriracha Quest</h1>
    <button id="mute" class="icon-btn" aria-label="Turn sound off">🔊</button>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" width="320" height="192" aria-label="Game screen"></canvas>

    <div id="card" class="overlay" hidden>
      <div class="panel" role="dialog" aria-live="polite">
        <h2 id="cardTitle"></h2>
        <div id="cardBody"></div>
        <div id="cardBtns" class="btns"></div>
      </div>
    </div>

    <div id="dialog" class="overlay dlg" hidden>
      <div class="panel" role="dialog" aria-live="polite">
        <div class="who"><canvas id="portrait" width="12" height="18"></canvas><span id="dlgWho"></span></div>
        <p id="dlgLine"></p>
        <div id="dlgOpts" class="opts"></div>
        <p id="dlgResult" class="result"></p>
        <button id="dlgCont" hidden>Keep going ▶</button>
      </div>
    </div>
  </div>

  <div class="touch" id="touch">
    <div class="pad">
      <button data-k="left" aria-label="Move left">◀</button>
      <button data-k="right" aria-label="Move right">▶</button>
    </div>
    <div class="pad">
      <button data-k="bark" aria-label="Pirate bark">🐶<small>BARK</small></button>
      <button data-k="fire" aria-label="Throw sriracha">🌶️<small>SAUCE</small></button>
      <button data-k="jump" class="big" aria-label="Jump">JUMP</button>
    </div>
  </div>
  <p class="keys-hint"><kbd>←</kbd><kbd>→</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>X</kbd> sauce &nbsp; <kbd>B</kbd> Pirate bark &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>M</kbd> sound</p>
</div>

<script>
'use strict';
/* ---------- basics ---------- */
const W = 320, H = 192, T = 16;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const wrapv = (v, m) => ((v % m) + m) % m;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------- sprites ---------- */
function makeSprite(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const col = pal[r[i]]; if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } } });
  return c;
}
function spr(img, x, y, flip = false, scale = 1) {
  x = Math.round(x); y = Math.round(y);
  if (flip) { ctx.save(); ctx.translate(x + img.width * scale, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, img.width * scale, img.height * scale); ctx.restore(); }
  else ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
}
function sprUpsideDown(img, x, y) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y) + img.height); ctx.scale(1, -1); ctx.drawImage(img, 0, 0); ctx.restore();
}

const ZPAL = { h:'#3a2414', r:'#e8453c', s:'#c98d5e', k:'#1a1a1a', m:'#7a2a1e', g:'#2fa84f', b:'#2b5fb3', o:'#262626' };
const ZPAL_HOT = Object.assign({}, ZPAL, { g:'#ff6a1f', r:'#ffd23f' });
const ZTOP = ["...h.hh.h...","..hhhhhhhh..",".hhhhhhhhhh.","rrrrrrrrrrr.",".hhssssssss.",".hsssskssks.",".ssssssssss.","..ssssmmmss.","...ssssss..."];
const ZBODY = ["..gggggggg..",".gggggggggg.",".sggggggggs."];
const ZBODYJ = ["s.gggggggg.s","sggggggggggs",".gggggggggg."];
const ZLEGS = {
  stand:["..bbbbbbbb..","..bbb..bbb..","..sss..sss..","..oooo.oooo."],
  runA:["..bbbbbbbb..",".bbb....bbb.",".ss......ss.","ooo......ooo"],
  runB:["..bbbbbbbb..","...bbbbbb...","....ssss....","...oooooo..."],
  jump:["..bbbbbbbb..",".bbb...bbb..",".ss.....ss..","oo.....oo..."]
};
function zset(pal) {
  return {
    stand: makeSprite([...ZTOP, ...ZBODY, ...ZLEGS.stand], pal),
    runA: makeSprite([...ZTOP, ...ZBODY, ...ZLEGS.runA], pal),
    runB: makeSprite([...ZTOP, ...ZBODY, ...ZLEGS.runB], pal),
    jump: makeSprite([...ZTOP, ...ZBODYJ, ...ZLEGS.jump], pal)
  };
}
const Z = zset(ZPAL), ZH = zset(ZPAL_HOT);

const PERSON_SHORT = ["...HHHHHH...","..HHHHHHHH..","..HHssssHH..","..ssksskss..","..ssssssss..","..sssmmsss..","...ssssss...","..TTTTTTTT..",".TTTTTTTTTT.",".sTTTTTTTTs.",".sTTTTTTTTs.","..TTTTTTTT..","..LLLLLLLL..","..LLL..LLL..","..LLL..LLL..","..LLL..LLL..","..LLL..LLL..",".kkkk..kkkk."];
const PERSON_LONG = ["...HHHHHH...","..HHHHHHHH..",".HHHssssHHH.",".HssksskssH.",".HssssssssH.",".HsssmmsssH.",".HHssssssHH.",".HTTTTTTTTH.",".HTTTTTTTTH.",".sTTTTTTTTs.",".sTTTTTTTTs.","..TTTTTTTT..","..LLLLLLLL..","..LLL..LLL..","..LLL..LLL..","..LLL..LLL..","..LLL..LLL..",".kkkk..kkkk."];
const PEOPLE = {
  mom: makeSprite(PERSON_LONG, { H:'#4a2c1a', s:'#c98d5e', k:'#1a1a1a', m:'#a0453a', T:'#2ab0a0', L:'#33415c' }),
  dad: makeSprite(PERSON_SHORT, { H:'#2b1d14', s:'#c98d5e', k:'#1a1a1a', m:'#7a2a1e', T:'#3b6fd9', L:'#4a4a4a' }),
  allegra: makeSprite(PERSON_LONG, { H:'#7a4a2a', s:'#c98d5e', k:'#1a1a1a', m:'#c0505a', T:'#9b59d0', L:'#2d3a6b' })
};
const NAMES = { mom:'Mom', dad:'Dad', allegra:'Allegra' };

const PIR_PAL = { w:'#fafafa', k:'#1c1c1c', p:'#ff7a9a' };
const PIR_TOP = ["..........kk..",".........kkkk.","k........kwkww",".k......wkkwwk","..wwwwwwwwwwp.",".wwkkkwwwwww..",".wkkkkwwwwww..",".wwkkwwwwwww.."];
const PIR_A = makeSprite([...PIR_TOP, ".ww.ww..ww.ww.", ".ww.ww..ww.ww."], PIR_PAL);
const PIR_B = makeSprite([...PIR_TOP, "..ww.ww.ww.ww.", "..ww.ww.ww.ww."], PIR_PAL);

const BUG_PAL = { c:'#8d93a6', k:'#2a2a35', w:'#ffffff' };
const BUG_TOP = ["....cccc....","..cccccccc..",".cccccccccc.",".ckkccccckk.","cccwkcckwccc","cccccccccccc","cccckkkkcccc",".cccccccccc."];
const BUG_A = makeSprite([...BUG_TOP, "..cc....cc..", ".kkk....kkk."], BUG_PAL);
const BUG_B = makeSprite([...BUG_TOP, "...cc..cc...", "..kkk..kkk.."], BUG_PAL);

const FOODPAL = { o:'#d08a35', y:'#f7c843', R:'#d7261e', w:'#fdfdfd', Y:'#ffb300', B:'#3d7bd9' };
const FOOD = [
  makeSprite(["oooooooo","yyRyyyRy",".yyyyyy.",".yRyyRy.","..yyyy..","..yRyy..","...yy...","...y...."], FOODPAL),
  makeSprite(["..wwww..",".wwwwww.","wwwYYwww","wwYYYYRw","wwYYYYww","wRwYYwww",".wwwwRw.","..wwww.."], FOODPAL),
  makeSprite(["..wwww..",".wwRwww.","wwwwwRww","BBBBBBBB",".BBBBBB.",".BBwBBB.","..BBBB..","...BB..."], FOODPAL)
];
const BOTTLE = makeSprite(["..ww..","..ww..",".wwww.",".RRRR.","RRRRRR","RwwwwR","RwggwR","RwrrwR","RwwwwR","RRRRRR","RRRRRR",".RRRR."], { w:'#ffffff', R:'#d7261e', g:'#2fa84f', r:'#ff5a3a' });
const HEART = makeSprite([".rr.rr.","rrrrrrr","rrrrrrr",".rrrrr.","..rrr..","...r..."], { r:'#ff3b5c' });
const HEART_E = makeSprite([".rr.rr.","rrrrrrr","rrrrrrr",".rrrrr.","..rrr..","...r..."], { r:'#4a3a4a' });
const STAR = makeSprite(["...y...","..yyy..","yyyyyyy",".yyyyy.",".yy.yy.","yy...yy"], { y:'#ffd23f' });

/* ---------- audio ---------- */
let actx = null, muted = false;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
  if (muted || !actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const seq = (notes, gap, type = 'square', vol = 0.06, dur = 0.12) => notes.forEach((f, i) => setTimeout(() => beep(f, dur, type, vol), i * gap));
const sfx = {
  jump: () => beep(330, 0.14, 'square', 0.045, 500),
  coin: () => { beep(988, 0.06, 'square', 0.045); setTimeout(() => beep(1319, 0.1, 'square', 0.045), 60); },
  stomp: () => beep(240, 0.12, 'square', 0.07, -160),
  hurt: () => beep(220, 0.3, 'sawtooth', 0.06, -150),
  bark: () => { beep(620, 0.07, 'square', 0.08, -320); setTimeout(() => beep(560, 0.09, 'square', 0.08, -320), 110); },
  fire: () => beep(820, 0.08, 'sawtooth', 0.035, -520),
  power: () => seq([523, 659, 784, 1047], 70, 'square', 0.05, 0.09),
  right: () => seq([659, 784, 988, 1319], 90, 'triangle', 0.09, 0.14),
  wrong: () => { beep(311, 0.16, 'triangle', 0.09); setTimeout(() => beep(233, 0.3, 'triangle', 0.09), 170); },
  thud: () => beep(90, 0.35, 'sawtooth', 0.09, -40),
  bossHit: () => beep(460, 0.15, 'square', 0.07, -320),
  win: () => seq([523, 659, 784, 1047, 784, 1047], 130, 'square', 0.06, 0.16)
};
const SONGS = {
  happy: { tempo:135, mel:[72,0,76,79,81,79,76,0,74,0,77,81,79,0,0,0,72,0,76,79,84,83,81,79,77,76,74,76,72,0,0,0], bass:[48,0,48,0,53,0,53,0,50,0,50,0,55,0,55,0,48,0,48,0,53,0,53,0,55,0,55,0,48,0,48,0] },
  woods: { tempo:125, mel:[69,72,74,0,76,74,72,69,67,69,72,0,69,0,0,0,69,72,74,76,79,76,74,72,74,72,69,67,69,0,0,0], bass:[45,0,45,0,43,0,43,0,41,0,41,0,40,0,40,0] },
  castle: { tempo:150, mel:[64,67,71,67,72,71,67,64,62,66,69,66,71,69,66,62,64,67,71,74,72,71,69,67,66,67,69,71,64,0,0,0], bass:[40,0,40,0,38,0,38,0,36,0,36,0,35,0,35,0] },
  boss: { tempo:115, mel:[57,57,60,57,63,62,60,57,57,57,60,57,64,63,62,60], bass:[33,33,33,33,36,36,38,38] }
};
let musicTimer = null, step = 0;
function startMusic(name) {
  stopMusic(); if (!actx) return;
  const s = SONGS[name]; if (!s) return; step = 0;
  musicTimer = setInterval(() => {
    if (G.state === 'play' && !muted) {
      const m = s.mel[step % s.mel.length], b = s.bass[step % s.bass.length];
      if (m) beep(mtof(m), 0.11, 'square', 0.022);
      if (b) beep(mtof(b), 0.18, 'triangle', 0.05);
    }
    step++;
  }, s.tempo);
}
function stopMusic() { if (musicTimer) clearInterval(musicTimer); musicTimer = null; }

/* ---------- choices ---------- */
const CHOICES = {
  l1a: { line:"Good morning, Zayd! I made eggs. Can you wash your hands before you eat?", thanks:"Thank you, sweetie!",
    options:[
      { t:"“Yes, Mom! Thanks for making breakfast!”", ok:true, r:"Mom smiles and slides the sriracha across the table. SRIRACHA POWER!" },
      { t:"“I washed them last week. They’re still good.”", r:"Mom gives you The Look. Even Pirate backs away slowly." },
      { t:"Wipe your hands on Pirate instead.", r:"Pirate is not a towel. Pirate would like to speak to the manager." }
    ] },
  l1b: { line:"Zayd, I’m doing homework. Can you please not bug me right now?", thanks:"Thanks, Zayd!",
    options:[
      { t:"“Okay! Pirate and I will go play outside.”", ok:true, r:"Allegra says “thanks, Zayd.” That might be the nicest thing she’s said all week!" },
      { t:"Narrate her homework like a sports announcer.", r:"“AND SHE WRITES A SEVEN! THE CROWD GOES WILD!” Allegra does not go wild. Allegra yells “MOOOOM!”" },
      { t:"Poke her. Just a little. 47 times.", r:"Poke number 3 is where it all went wrong." }
    ] },
  l2a: { line:"Hey bud! Can you help me carry the groceries in?", thanks:"My guy!!",
    options:[

      { t:"Freeze like a statue so he can’t see you.", r:"Dad can see you. Statues don’t giggle." },
      { t:"“What do I get if I help?”", r:"Dad thinks about it. “You get… to live here.” Fair point." }
    ] },
  l2b: { line:"My friends are coming over. Can you give us some space?", thanks:"Thanks, little bro.",
    options:[

function buildGrid(def) {
  const g = Array.from({ length:12 }, () => Array(def.width).fill('.'));
  def.ground.forEach(([a, b]) => { for (let x = a; x <= b; x++) { g[10][x] = '#'; g[11][x] = '#'; } });
  (def.blocks || []).forEach(([x, y, len, ch]) => { for (let i = 0; i < len; i++) if (x + i < def.width) g[y][x + i] = ch; });
  (def.spikes || []).forEach(([x, len]) => { for (let i = 0; i < len; i++) g[9][x + i] = '^'; });
  return g;
}

function makeEnemy(x, y) { return { x, y, w:12, h:10, vx:0, vy:0, dir:-1, alive:true, dead:0, anim:0, onGround:false }; }

  def.enemies.forEach(x => L.enemies.push(makeEnemy(x * T + 2, 150)));
  def.npcs.forEach(n => L.npcs.push({ x:n.x * T + 2, y:160 - 18, who:n.who, choice:CHOICES[n.choice], resolved:false, thanks:0, leave:!!n.leave, leaving:false, gone:false, alpha:1 }));
  P = { x:def.start * T + 3, y:145, w:10, h:15, vx:0, vy:0, face:1, onGround:false, coyote:0, buffer:0, inv:0, power:0, fireCd:0, barkCd:0, anim:0 };

function resetPirate() { L.hist = []; L.pir.x = P.x - 16; L.pir.y = P.y + P.h; }

/* ---------- physics ---------- */
function solidAt(px, py) {
  const cx = Math.floor(px / T), cy = Math.floor(py / T);
  if (cx < 0 || cx >= L.w) return true;
  if (cy < 0 || cy >= 12) return false;
  return SOLID.has(L.grid[cy][cx]);
}
function moveEntity(e) {
  e.hitWall = false;
  e.x += e.vx;
  if (e.vx > 0) {
    const rx = e.x + e.w - 0.01;
    if (solidAt(rx, e.y + 1) || solidAt(rx, e.y + e.h / 2) || solidAt(rx, e.y + e.h - 1)) { e.x = Math.floor(rx / T) * T - e.w; e.vx = 0; e.hitWall = true; }
  } else if (e.vx < 0) {
    if (solidAt(e.x, e.y + 1) || solidAt(e.x, e.y + e.h / 2) || solidAt(e.x, e.y + e.h - 1)) { e.x = Math.floor(e.x / T) * T + T; e.vx = 0; e.hitWall = true; }
  }
  e.y += e.vy; e.onGround = false;
  if (e.vy > 0) {
    const by = e.y + e.h;
    if (solidAt(e.x + 1, by) || solidAt(e.x + e.w - 1, by)) { e.y = Math.floor(by / T) * T - e.h; e.vy = 0; e.onGround = true; }
  } else if (e.vy < 0) {
    if (solidAt(e.x + 1, e.y) || solidAt(e.x + e.w - 1, e.y)) { e.y = Math.floor(e.y / T) * T + T; e.vy = 0; }
  }
}

/* ---------- effects ---------- */
function puff(x, y, col, n = 8) {

}
function floatText(x, y, s, col = '#ffffff') { L.texts.push({ x, y, s, col, life:55 }); }
function banner(text) { L.banner = { text, t:110 }; }

/* ---------- actions ---------- */
function hurt() {
  if (P.inv > 0 || G.state !== 'play') return;
  G.hearts--; P.inv = 90; P.vy = -3.5; P.vx = -P.face * 1.5; L.shake = 8; sfx.hurt();
  if (G.hearts <= 0) gameOver();
}
function respawn() {

}
function killEnemy(e, pts = 50) {

  G.score += pts; floatText(e.x, e.y - 4, '+' + pts); puff(e.x + 6, e.y + 5, ['#8d93a6', '#ffffff']); sfx.stomp();
}
function shoot() {
  const boss = !!(L.boss && !L.boss.dying);
  P.fireCd = 14; sfx.fire();
  L.fire.push({ x:P.x + (P.face > 0 ? P.w : -6), y:P.y + 4, vx:P.face * (boss ? 3 : 3.6), vy:boss ? -3 : -1, life:boss ? 150 : 80, aimed:boss });
}
function bark() {

  L.rings.push({ x:cx, y:cy, r:4, life:24 });

  const B = L.boss;
  if (B && !B.dying && Math.hypot(B.x + 24 - cx, B.y + 17 - cy) < 120) { B.stun = 70; floatText(B.x + 16, B.y - 10, '?!', '#ffd23f'); }
}
function givePower(frames) {
  if (P.power > 1e8) return;
  P.power = Math.min(900, Math.max(P.power, 0) + frames);
}

/* ---------- boss ---------- */
function spawnBoss() {
  L.boss = { x:136, y:-40, w:48, h:34, hp:16, max:16, mode:'enter', t:0, vx:0.9, vy:0, stun:0, flash:0, dying:0, rest:0 };
  L.shake = 20; P.power = 1e9;
}
function hitBoss() {
  const B = L.boss; if (!B || B.flash > 0 || B.dying) return;
  B.hp--; B.flash = 30; sfx.bossHit(); G.score += 100;
  floatText(B.x + 14, B.y - 8, '+100', '#ffd23f'); puff(B.x + 24, B.y + 17, ['#ff3b1f', '#ff8a00', '#ffd23f'], 12);
  if (B.hp <= 0) {
    B.dying = 1; L.drops = [];
    L.enemies.forEach(e => { if (e.alive) killEnemy(e, 0); });
    banner('GRUMPUS DEFEATED!'); sfx.win(); stopMusic();
  }
}
function updateBoss() {
  const B = L.boss; if (!B) return;
  B.t++; if (B.flash > 0) B.flash--;
  if (B.dying) {
    B.dying++; B.y -= 0.4;
    if (B.dying % 6 === 0) puff(B.x + rand(0, 48), B.y + rand(0, 30), ['#ffffff', '#ffd23f', '#ff8a00'], 3);
    if (B.dying === 170) finishGame();
    return;
  }
  const hoverY = 24 + Math.sin(B.t * 0.05) * 6;
  if (B.stun > 0) B.stun--;
  else if (B.mode === 'enter') { B.y += 1; if (B.y >= 24) { B.y = 24; B.mode = 'hover'; B.t = 0; } }
  else if (B.mode === 'hover') {
    B.x += B.vx; if (B.x < 8 || B.x > W - 8 - B.w) B.vx *= -1;
    B.y = hoverY;
    const rate = B.hp <= 8 ? 70 : 100;
    if (B.t % rate === 0) L.drops.push({ x:B.x + 12 + Math.random() * 24, y:B.y + B.h - 4, vy:0.5 });
    if (B.t % 300 === 0) { B.mode = 'slam'; B.vy = 0; }
    if (B.hp <= 10 && B.t % 420 === 0 && L.enemies.filter(e => e.alive).length < 2) {
      const e = makeEnemy(B.x + 18, B.y + B.h); e.dir = Math.random() < 0.5 ? -1 : 1; L.enemies.push(e);
    }
  } else if (B.mode === 'slam') {
    B.vy = Math.min(B.vy + 0.25, 5); B.y += B.vy;
    if (B.y >= 160 - B.h) { B.y = 160 - B.h; B.mode = 'rest'; B.rest = 80; L.shake = 12; sfx.thud(); }
  } else if (B.mode === 'rest') { if (--B.rest <= 0) B.mode = 'rise'; }
  else if (B.mode === 'rise') { B.y -= 1.2; if (B.y <= hoverY) B.mode = 'hover'; }

  const hb = { x:B.x + 4, y:B.y + 6, w:B.w - 8, h:B.h - 8 };
  if (overlap(P, hb)) {
    if (P.vy > 0.5 && P.y + P.h - hb.y < 12) { hitBoss(); P.vy = -5.5; }
    else hurt();
  }
  for (const f of L.fire) if (f.life > 0 && overlap({ x:f.x, y:f.y, w:6, h:6 }, hb)) { f.life = 0; hitBoss(); }
}

/* ---------- update ---------- */
function update() {
  if (!L) return;
  L.t++;
  if (L.shake > 0) L.shake--;
  if (G.state === 'play') updatePlay();
  if (G.state === 'ending' && L.conf) L.conf.forEach(c => { c.y += c.vy; c.x += Math.sin((L.t + c.y) * 0.05) * 0.3; if (c.y > H) { c.y = -4; c.x = rand(0, W); } });
  for (const p of L.parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--; }
  L.parts = L.parts.filter(p => p.life > 0);
  for (const t of L.texts) { t.y -= 0.5; t.life--; }
  L.texts = L.texts.filter(t => t.life > 0);
  for (const r of L.rings) { r.r += 4; r.life--; }
  L.rings = L.rings.filter(r => r.life > 0);
  if (L.banner && --L.banner.t <= 0) L.banner = null;
  prev.jump = keys.jump;
}

function updatePlay() {
  /* player movement */
  const hot = P.power > 0;
  const accel = P.onGround ? 0.28 : 0.2;
  const maxV = hot ? 2.3 : 1.8;
  if (keys.left && !keys.right) { P.vx -= accel; P.face = -1; }
  else if (keys.right && !keys.left) { P.vx += accel; P.face = 1; }
  else { P.vx *= P.onGround ? 0.75 : 0.93; if (Math.abs(P.vx) < 0.05) P.vx = 0; }
  P.vx = clamp(P.vx, -maxV, maxV);
  const jumpPressed = keys.jump && !prev.jump;
  if (jumpPressed) P.buffer = 7; else if (P.buffer > 0) P.buffer--;
  if (P.onGround) P.coyote = 7; else if (P.coyote > 0) P.coyote--;
  if (P.buffer > 0 && P.coyote > 0) { P.vy = -5.6; P.buffer = 0; P.coyote = 0; sfx.jump(); }
  if (!keys.jump && P.vy < -2.2) P.vy = -2.2;
  P.vy = Math.min(P.vy + 0.3, 6.5);
  moveEntity(P);
  if (P.onGround && Math.abs(P.vx) > 0.3) P.anim++;
  if (P.inv > 0) P.inv--;
  if (P.fireCd > 0) P.fireCd--;
  if (P.barkCd > 0) P.barkCd--;
  if (P.power > 0 && P.power < 1e8) { P.power--; if (P.power === 0) floatText(P.x - 20, P.y - 10, 'sauce gone!', '#ffd23f'); }
  if (hot && L.t % 3 === 0) L.parts.push({ x:P.x + rand(0, P.w), y:P.y + rand(2, P.h), vx:rand(-0.3, 0.3), vy:rand(-1.2, -0.4), life:16, col:['#ff3b1f', '#ff8a00', '#ffd23f'][L.t % 3], s:2 });
  if (keys.fire && P.fireCd <= 0) {
    if (P.power > 0 && L.fire.length < 3) shoot();
    else if (P.power <= 0) { P.fireCd = 40; floatText(P.x - 28, P.y - 12, 'need sauce!', '#ffd23f'); }
  }
  if (keys.bark && P.barkCd <= 0) bark();

  /* pirate */
  L.hist.push({ x:P.x, y:P.y + P.h, face:P.face, mv:Math.abs(P.vx) > 0.3 });
  if (L.hist.length > 18) L.hist.shift();
  const h0 = L.hist[0];
  const tx = h0.x + P.w / 2 - 7 - h0.face * 14;
  L.pir.x += (tx - L.pir.x) * 0.25; L.pir.y += (h0.y - L.pir.y) * 0.25;
  L.pir.face = h0.face; L.pir.moving = h0.mv || Math.abs(tx - L.pir.x) > 1;
  if (L.pir.moving) L.pir.anim++;

  /* sriracha shots */
  for (const f of L.fire) {
    f.life--;
    if (f.aimed && L.boss && !L.boss.dying) {
      const bx = L.boss.x + L.boss.w / 2, by = L.boss.y + L.boss.h / 2;
      const dx = bx - f.x, dy = by - f.y, d = Math.hypot(dx, dy) || 1;
      f.vx += (dx / d * 4.5 - f.vx) * 0.15; f.vy += (dy / d * 4.5 - f.vy) * 0.15;
      f.x += f.vx; f.y += f.vy;
    } else {
      f.vy = Math.min(f.vy + 0.25, 4);
      f.x += f.vx;
      if (solidAt(f.x + (f.vx > 0 ? 6 : 0), f.y + 3)) f.life = 0;
      f.y += f.vy;
      if (f.vy > 0 && solidAt(f.x + 3, f.y + 6)) { f.y = Math.floor((f.y + 6) / T) * T - 6; f.vy = -3; }
    }
    if (L.t % 2 === 0) L.parts.push({ x:f.x + 3, y:f.y + 3, vx:0, vy:0, life:10, col:'#ff8a00', s:2 });
    for (const e of L.enemies) if (e.alive && f.life > 0 && overlap({ x:f.x, y:f.y, w:6, h:6 }, e)) { killEnemy(e); f.life = 0; }
  }
  L.fire = L.fire.filter(f => f.life > 0 && f.x > L.camX - 30 && f.x < L.camX + W + 30 && f.y < H + 10 && f.y > -40);

  /* enemies */
  for (const e of L.enemies) {
    if (!e.alive) { if (e.dead) { e.vy += 0.25; e.y += e.vy; } continue; }
    if (!L.def.boss && Math.abs(e.x - P.x) > W + 40) continue;
    e.anim++;

    moveEntity(e);

    if (e.y > H + 20) { e.alive = false; continue; }
    if (overlap(P, e)) {
      if (P.vy > 0.5 && P.y + P.h - e.y < 9) { killEnemy(e); P.vy = keys.jump ? -5.2 : -3.8; }
      else hurt();
    }
  }
  L.enemies = L.enemies.filter(e => e.alive || e.y < H + 40);
  if (G.state !== 'play') return;

  /* pickups */
  for (const f of L.food) if (!f.got && overlap(P, f)) {
    f.got = true; G.food++; G.score += 10; sfx.coin();
    floatText(f.x - 4, f.y - 6, '+10', '#ffd23f'); puff(f.x + 4, f.y + 4, ['#ff3b1f', '#ffd23f'], 6);
  }
  for (const b of L.bottles) if (!b.got && overlap(P, b)) {

    puff(b.x + 3, b.y + 6, ['#ff3b1f', '#ff8a00', '#ffd23f'], 14);
  }

  /* spikes */
  const c0 = Math.floor(P.x / T), c1 = Math.floor((P.x + P.w - 1) / T);
  for (let c = c0; c <= c1; c++) {
    if (c >= 0 && c < L.w && L.grid[9][c] === '^' && overlap(P, { x:c * T + 1, y:9 * T + 8, w:14, h:8 })) { hurt(); if (G.state === 'play') P.vy = -4.5; }
  }
  if (G.state !== 'play') return;

  /* npcs */
  for (const n of L.npcs) {
    if (n.thanks > 0) n.thanks--;
    if (n.leaving) { n.alpha -= 1 / 60; if (n.alpha <= 0) { n.leaving = false; n.gone = true; if (L.def.boss && !L.boss) L.bossIn = 30; } }
    if (!n.resolved && P.x + P.w > n.x - 22) { P.x = n.x - 22 - P.w; P.vx = 0; openChoice(n); return; }
  }
  if (L.bossIn > 0 && --L.bossIn === 0) { bossIntro(); return; }

  /* pits */
  if (P.y > H + 16) {
    G.hearts--; sfx.hurt(); L.shake = 8;
    if (G.hearts <= 0) { gameOver(); return; }
    respawn();
  }

  /* flag */
  if (!L.def.boss && P.x + P.w > L.flagX + 6) { levelComplete(); return; }

  /* boss */
  if (L.def.boss) {
    updateBoss();
    for (const d of L.drops) {
      d.vy = Math.min(d.vy + 0.12, 4); d.y += d.vy;
      if (overlap(P, { x:d.x, y:d.y, w:3, h:5 })) { d.dead = true; hurt(); }
      if (d.y > 155) { d.dead = true; puff(d.x, 158, '#7fb3ff', 4); }
    }
    L.drops = L.drops.filter(d => !d.dead);
  }

  /* camera */
  const target = clamp(P.x - W * 0.4, 0, Math.max(0, L.w * T - W));
  L.camX += (target - L.camX) * 0.15;
}

    cardBtns.appendChild(el);
  });
  card.hidden = false;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function clearKeys() { Object.keys(keys).forEach(k => keys[k] = false); prev.jump = true; document.querySelectorAll('.touch button.on').forEach(b => b.classList.remove('on')); }

function titleScreen() {
  G.state = 'title'; loadLevel(0);
  showCard({
    title:'Sriracha Quest',
    body:"<p>Zayd is a ninja. His sidekick is Pirate, the best fluffy sidekick around!</p><p>Run, jump, stomp the Grumblebugs, and when someone stops you, make the choice a real hero would make. Good choices give you SRIRACHA POWER. 🌶️</p>" +
      "<dl class=\"controls\"><dt>Move</dt><dd>Arrow keys or A / D</dd><dt>Jump</dt><dd>Space or ↑</dd><dt>Throw sauce</dt><dd>X</dd><dt>Pirate bark</dt><dd>B</dd><dt>Pause</dt><dd>P</dd></dl>",
    buttons:[{ label:'Start ▶', action:() => { G.score = 0; G.stars = 0; G.food = 0; G.hearts = 3; G.levelIndex = 0; startLevel(); } }]
  });
}
function startLevel() {
  loadLevel(G.levelIndex);
  G.hearts = Math.max(G.hearts, 3);
  G.state = 'intro';
  const def = L.def;
  showCard({ title:'Level ' + (G.levelIndex + 1) + ': ' + def.name, body:def.intro,
    buttons:[{ label:'Let’s go!', action:() => { clearKeys(); G.state = 'play'; startMusic(def.song); } }] });
}
function levelComplete() {
  G.state = 'complete'; stopMusic(); sfx.win();
  const bonus = G.hearts * 100; G.score += bonus;
  const last = G.levelIndex + 1 >= LEVELS.length - 1;
  showCard({ title:'Level clear!', body:"<p>" + L.def.clear + "</p><div class=\"stats\">⭐ Kindness Stars: " + G.stars + "<br>🍕 Sriracha snacks: " + G.food + "<br>❤️ Heart bonus: +" + bonus + "<br>🏆 Score: " + G.score + "</div>",
    buttons:[{ label:last ? 'Final level ▶' : 'Next level ▶', action:() => { G.levelIndex++; startLevel(); } }] });
}
function gameOver() {
  G.state = 'over'; stopMusic();
  showCard({ title:'Oof!', body:"<p>The Grumblebugs got you this time. Even ninjas need a snack break.</p><p>Grab some sriracha and try this level again!</p>",
    buttons:[{ label:'Try again', action:() => {
      G.score = G.levelStartScore; G.stars = G.levelStartStars; G.food = G.levelStartFood; G.hearts = 3;
      loadLevel(G.levelIndex); clearKeys(); G.state = 'play'; startMusic(L.def.song);
    } }] });
}
function bossIntro() {
  G.state = 'intro'; stopMusic();
  showCard({ title:'THE GRUMPUS!', body:"<p>Uh oh. All the whining, poking and stomping in this house turned into one giant storm cloud: the Grumpus.</p><p>Good news: Pirate sniffed out the BIG bottle. Unlimited sriracha! Throw it with X (or the 🌶️ button) and it flies straight at the Grumpus. When it slams down, you can stomp it too!</p>",
    buttons:[{ label:'Sauce it! 🌶️', action:() => { spawnBoss(); clearKeys(); G.state = 'play'; startMusic('boss'); } }] });
}
function finishGame() {
  G.state = 'ending'; stopMusic(); sfx.win();
  L.conf = Array.from({ length:60 }, () => ({ x:rand(0, W), y:rand(-H, 0), vy:rand(0.4, 1.2), c:['#ff3b1f', '#ffd23f', '#2fa84f', '#3b6fd9', '#9b59d0'][Math.floor(rand(0, 5))] }));
  setTimeout(() => showCard({ bottom:true, title:'You did it, Zayd!',
    body:"<p>The Grumpus is gone, Allegra’s project is fixed, and dinner is ready: pizza, eggs AND rice. With sriracha on everything, obviously.</p><div class=\"stats\">⭐ Kindness Stars: " + G.stars + " of " + TOTAL_STARS + "<br>🍕 Sriracha snacks: " + G.food + "<br>🏆 Final score: " + G.score + "</div><p>Pirate says WOOF. (That means “good job.”)</p>",
    buttons:[{ label:'Play again', action:() => titleScreen() }] }), 1400);
}
function togglePause() {
  if (G.state === 'play') {
    G.state = 'paused'; clearKeys();
    showCard({ title:'Paused', body:"<p>Pirate is taking a quick nap. Zzz…</p>",
      buttons:[{ label:'Resume', action:() => { clearKeys(); G.state = 'play'; } },
               { label:'Restart level', action:() => { G.score = G.levelStartScore; G.stars = G.levelStartStars; G.food = G.levelStartFood; G.hearts = Math.max(G.hearts, 3); startLevel(); } }] });
  }
}

/* ---------- choice dialog ---------- */
const dialog = document.getElementById('dialog');
const dlgWho = document.getElementById('dlgWho');
const dlgLine = document.getElementById('dlgLine');
const dlgOpts = document.getElementById('dlgOpts');
const dlgResult = document.getElementById('dlgResult');
const dlgCont = document.getElementById('dlgCont');
const portrait = document.getElementById('portrait').getContext('2d');
let curNPC = null, curDone = false;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function openChoice(n) {
  G.state = 'dialog'; curNPC = n; curDone = false; n.tries = 0; clearKeys();
  const c = n.choice;
  dlgWho.textContent = NAMES[n.who];
  portrait.clearRect(0, 0, 12, 18); portrait.drawImage(PEOPLE[n.who], 0, 0);
  dlgLine.textContent = c.line;
  dlgResult.textContent = ''; dlgResult.className = 'result';
  dlgCont.hidden = true; dlgOpts.innerHTML = '';
  shuffle(c.options.slice()).forEach((o, i) => {
    const b = document.createElement('button');
    const num = document.createElement('span'); num.className = 'num'; num.textContent = i + 1;
    const label = document.createElement('span'); label.textContent = o.t;
    b.append(num, label);
    b.addEventListener('click', () => pick(o, b));
    dlgOpts.appendChild(b);
  });
  dialog.hidden = false;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function pick(o, btn) {
  if (curDone || btn.disabled) return;
  ensureAudio(); curNPC.tries++;
  if (o.ok) {
    curDone = true; btn.classList.add('right');
    dlgOpts.querySelectorAll('button').forEach(b => b.disabled = true);
    const bonus = curNPC.tries === 1 ? 500 : 200;
    G.stars++; G.score += bonus; G.hearts = Math.min(5, G.hearts + 1); givePower(720);
    dlgResult.textContent = o.r + "  ⭐ +1 Kindness Star, +1 heart, +" + bonus + " points!";
    dlgResult.className = 'result good'; sfx.right();
    dlgCont.hidden = false;
  } else {
    btn.classList.add('wrong'); btn.disabled = true;
    dlgResult.textContent = o.r + "  Hmm… maybe there’s a better choice.";
    dlgResult.className = 'result bad'; sfx.wrong();
  }
}
dlgCont.addEventListener('click', () => {
  if (dialog.hidden || !curDone) return;
  dialog.hidden = true;
  const n = curNPC;
  n.resolved = true; n.thanks = 150; P.inv = 60;
  L.checkpoint = { x:n.x + 20 };
  if (n.leave) n.leaving = true;
  banner('SRIRACHA POWER!'); puff(P.x + 5, P.y + 6, ['#ff3b1f', '#ff8a00', '#ffd23f'], 14);
  clearKeys(); G.state = 'play';
});

/* ---------- input ---------- */
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyZ:'jump', KeyX:'fire', KeyF:'fire', KeyB:'bark', KeyC:'bark' };
window.addEventListener('keydown', e => {
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (G.state === 'dialog') {
    if (/^[1-3]$/.test(e.key)) { const b = dlgOpts.querySelectorAll('button')[Number(e.key) - 1]; if (b) b.click(); e.preventDefault(); }
    else if ((e.key === 'Enter' || e.code === 'Space') && !dlgCont.hidden) { e.preventDefault(); dlgCont.click(); }
    else if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    return;
  }
  if (!card.hidden) {
    if (e.key === 'Enter' || e.code === 'Space') { e.preventDefault(); if (!e.repeat) { const b = cardBtns.querySelector('button'); if (b) b.click(); } }
    return;
  }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { clearKeys(); if (G.state === 'play') togglePause(); });
document.querySelectorAll('.touch button').forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); ensureAudio(); keys[k] = true; btn.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
const muteBtn = document.getElementById('mute');
function toggleMute() {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
}
muteBtn.addEventListener('click', () => { ensureAudio(); toggleMute(); muteBtn.blur(); });

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
titleScreen();
requestAnimationFrame(frame);
</script>
